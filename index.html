<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Saim Ali Portfolio</title>

  <meta name="description" content="Portfolio website of Saim Ali showing projects, skills, and contact information.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Saim Ali",
    "jobTitle": "Web Developer",
    "url": "https://example.com"
  }
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: linear-gradient(to right, #e3f2fd, #ffffff);
      color: #222;
    }

    header {
      background: #1565c0;
      padding: 15px;
    }

    nav a {
      color: white;
      margin-right: 15px;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      padding: 20px;
    }

    section {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    img {
      width: 160px;
      border-radius: 50%;
      display: block;
      margin-bottom: 15px;
    }

    input, button {
      padding: 8px;
      width: 100%;
      max-width: 300px;
    }

    button {
      margin-top: 10px;
      cursor: pointer;
    }

    footer {
      background: #eeeeee;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>

<body>

  <header>
    <nav role="navigation">
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main role="main">

    <section id="about">
      <h1>Saim Ali</h1>

      <img src="https://images.unsplash.com/photo-1527980965255-d3b416303d12" alt="Profile photo of a developer">

      <p>
        I am a web developer. This portfolio shows my skills and academic projects.
      </p>
    </section>

    <section id="projects">
      <h2>Projects</h2>

      <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085" alt="Laptop showing code on screen">

      <ul>
        <li>Portfolio website</li>
        <li>Student management system</li>
        <li>Data analysis dashboard</li>
      </ul>
    </section>

    <section id="contact">
      <h2>Contact Me</h2>

      <form>
        <label for="name">Name</label><br>
        <input type="text" id="name"><br><br>

        <label for="email">Email</label><br>
        <input type="email" id="email"><br>

        <button type="submit">Send</button>
      </form>
    </section>

  </main>

  <footer>
    <p>© 2025 Saim Ali</p>
  </footer>

</body>
</html>
